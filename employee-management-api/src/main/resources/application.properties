spring.application.name=employee-management-api

server.port=8080

spring.datasource.url=jdbc:h2:mem:employeesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

application.security.jwt.secret-key=ThisIsASecretKeyForJwtAuthenticationThatShouldBeLongEnoughForHS256Algorithm
application.security.jwt.expiration-ms=86400000
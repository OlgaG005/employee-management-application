<div class="login-page">
  <div class="login-card">
    <h1>Employee Management</h1>
    <p class="subtitle">Sign in to continue</p>


    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" novalidate>
      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          #emailInput="ngModel"
          placeholder="admin@test.com"
          required
          email
        />

        <p class="field-error" *ngIf="emailInput.errors?.['required'] && emailInput.touched">
          Email is required.
        </p>
        <p class="field-error" *ngIf="emailInput.errors?.['email'] && emailInput.touched">
          Please enter a valid email address.
        </p>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          #passwordInput="ngModel"
          placeholder="Admin123!"
          required
          minlength="6"
        />

        <p class="field-error" *ngIf="passwordInput.errors?.['required'] && passwordInput.touched">
          Password is required.
        </p>

        <p class="field-error" *ngIf="passwordInput.errors?.['minlength'] && passwordInput.touched">
          Password must be at least 6 characters.
        </p>
      </div>

      <!-- Backend/API error message -->
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <div class="test-users">
      <p><strong>Admin:</strong> admin@test.com / Admin123!</p>
      <p><strong>User:</strong> user@test.com / User123!</p>
    </div>
  </div>
</div>
